name: Deploy QuickFix Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: none
      - name: Prepare website
        run: |
          mkdir public
          cp index.html public/
          mkdir -p public/assets/css public/assets/js
          cp assets/css/style.css public/assets/css/
          cp assets/js/app.js public/assets/js/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4